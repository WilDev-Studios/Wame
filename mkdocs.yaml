site_name: Wame Engine
site_url: https://wame.wildevstudios.net
copyright: Copyright &copy; 2025 WilDev Studios. This software is protected by copyright and licensed under the MIT license.

repo_url: https://github.com/WilDev-Studios/Wame

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo-padded.png
  palette:
    - scheme: slate
      primary: green
      accent: cyan
  font:
    text: Monospace
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - redirects
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3.7/objects.inv
            - https://www.pygame.org/docs/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          paths: ["."]
          options:
            heading_level: 3
            annotations_path: source
            docstring_style: numpy
            docstring_section_style: spacy
            inherited_members: true
            merge_init_into_class: true
            separate_signature: true
            show_signature: true
            show_signature_annotations: true
            show_source: false
            show_submodules: false
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            extra:
              show_imports: false
              show_toc: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WilDev-Studios/Wame
    - icon: fontawesome/brands/discord
      link: https://discord.gg/4Ggybyy87d

nav:
  - Home: index.md
  - API Reference:
    - Color:
      - RGB: pages/api/color/rgb.md
      - Values: pages/api/color/values.md
    - Plugins:
      - Events:
        - Base: pages/api/plugins/events/base.md
        - Lifetime: pages/api/plugins/events/lifetime.md
        - Scene:
          - Base: pages/api/plugins/events/scene/base.md
          - Joystick: pages/api/plugins/events/scene/joystick.md
          - Key: pages/api/plugins/events/scene/key.md
          - Mouse: pages/api/plugins/events/scene/mouse.md
          - Other: pages/api/plugins/events/scene/other.md
          - Window: pages/api/plugins/events/scene/window.md
      - Execution: pages/api/plugins/execution.md
      - Handler: pages/api/plugins/handler.md
      - Plugin: pages/api/plugins/plugin.md
    - UI:
      - Anchor: pages/api/ui/anchor.md
      - Element: pages/api/ui/element.md
      - Frame: pages/api/ui/frame.md
      - Text: pages/api/ui/text.md
    - Utils:
      - Keys: pages/api/utils/keys.md
      - Tween: pages/api/utils/tween.md
    - Vector:
      - Base: pages/api/vector/base.md
      - XY: pages/api/vector/xy.md
      - XYZ: pages/api/vector/xyz.md
    - Engine: pages/api/engine.md
    - Interval: pages/api/interval.md
    - Pipeline: pages/api/pipeline.md
    - Scene: pages/api/scene.md
    - Settings: pages/api/settings.md
  - Changelog:
